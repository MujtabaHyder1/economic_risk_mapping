# Configuration for Economic Risk Mapping project
# This file holds parameters used by the training pipeline.
# Add or modify entries as needed.

MODEL_TRAINING:
  hyperparameter_grid:
    n_estimators: [100, 200, 300]
    max_depth: [4, 6, 8]
    learning_rate: [0.01, 0.05, 0.1]
    subsample: [0.7, 0.85]
    colsample_bytree: [0.7, 0.85]
    gamma: [0, 1]
